<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nav-demo</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1>nav-demo</h1>
      <button type="button" id="theme-toggle" class="theme-toggle"
              aria-label="切换暗色模式" title="切换暗色模式" aria-pressed="false">🌙</button>
    </div>
  </header>

  <main class="page">
    <section>
      <h2 class="section-title">平台入口</h2>
      <div id="platforms-list" class="platforms-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p id="index-disclaimer">本页面仅提供第三方线路跳转，不代理、不存储任何平台内容，线路可用性由第三方决定。</p>
  </footer>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/index.js"></script>
</body>
</html>
