<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>导航 - nav-demo</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="back-link" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>返回总入口</a>
      <h1 id="page-title">加载中…</h1>
      <a class="back-link" href="index.html" title="平台切换"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>切换平台</a>
      <button type="button" id="theme-toggle" class="theme-toggle"
              aria-label="切换暗色模式" title="切换暗色模式" aria-pressed="false">🌙</button>
    </div>
  </header>

  <main class="page">
    <section id="platform-content" hidden>
      <div class="controls">
        <div class="control-block">
          <label class="control-label" for="route-select">当前线路</label>
          <div class="route-row">
            <select id="route-select" class="route-select"></select>
            <span id="route-badge" class="badge"></span>
          </div>
        </div>

        <div class="control-block">
          <label class="control-label" for="username-input">输入用户名或主页链接</label>
          <input id="username-input" class="text-input" type="text" autocomplete="off"
                 placeholder="输入用户名、@用户名 或主页链接">
          <div id="parse-result" class="parse-result" hidden>
            <div class="parsed-username">解析结果：<strong id="parsed-name"></strong></div>
            <div id="parse-routes" class="route-buttons"></div>
          </div>
          <div id="parse-error" class="parse-error" hidden></div>
        </div>
      </div>

      <section>
        <div class="follows-toolbar">
          <div class="search-wrap">
            <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="search-input" class="search-input" type="search" autocomplete="off"
                   placeholder="搜索展示名、用户名或备注">
          </div>
          <label class="group-toggle">
            <input type="checkbox" id="group-toggle"> 按标签分组
          </label>
        </div>
        <div id="tag-filter" class="tag-filter"></div>
        <div id="follows-list" class="follows-list"></div>
      </section>
    </section>

    <section id="platform-error" class="empty" hidden>
      <p>平台不存在或已停用</p>
      <p><a class="back-link" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>返回总入口</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <p id="disclaimer"></p>
  </footer>

  <div id="toast" class="toast" hidden></div>

  <div id="copy-fallback" class="copy-fallback" hidden>
    <div class="copy-fallback-box">
      <p>复制失败，请手动复制用户名：</p>
      <input id="copy-fallback-input" class="text-input" type="text" readonly>
      <div class="copy-fallback-actions">
        <button type="button" id="copy-fallback-retry" class="btn btn-primary">再次复制</button>
        <button type="button" id="copy-fallback-close" class="btn">关闭</button>
      </div>
    </div>
  </div>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/platform.js"></script>
</body>
</html>
